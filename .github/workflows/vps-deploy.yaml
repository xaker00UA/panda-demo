name: Deploy container to VPS

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      short_commit:
        required: true
        type: string
      git_tag:
        required: false
        type: string
        default: ""
      commit:
        required: true
        type: string
      branch:
        required: true
        type: string
    secrets:
      VPS_HOST:
        required: true
      VPS_USER:
        required: true
      VPS_SSH_KEY:
        required: true
      VPS_KNOWN_HOSTS:
        required: true
      VPS_PORT:
        required: false
      VPS_PATH:
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-vps
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Deploy with health checks and automatic rollback
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          APP_IMAGE: ${{ inputs.image }}
          GIT_SHORT_HASH: ${{ inputs.short_commit }}
          GIT_TAG: ${{ inputs.git_tag }}
          DEPLOY_COMMIT: ${{ inputs.commit }}
          DEPLOY_BRANCH: ${{ inputs.branch }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/deploy-vps.sh
